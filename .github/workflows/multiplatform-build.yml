name: Build Windows Installer
on: 
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (Clean & Light JAR)
        shell: bash
        run: |
          # On nettoie tout et on génère un JAR sans dépendances internes
          mvn clean package -DskipTests -Dshade.skip=true

      - name: Setup JavaFX Modules
        shell: bash
        run: |
          curl -L -o javafx-jmods.zip https://download2.gluonhq.com/openjfx/17.0.10/openjfx-17.0.10_windows-x64_bin-jmods.zip
          unzip -q javafx-jmods.zip

      - name: Create Executable Package (Windows)
        shell: bash
        run: |
          # 1. Création d'un JRE réduit (Runtime Image) pour limiter la taille
          # On ne garde que les modules strictement nécessaires
          jlink \
            --add-modules java.base,java.sql,java.naming,java.desktop,java.management,java.security.jgss,java.instrument,java.net.http,jdk.unsupported \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=2 \
            --output custom-runtime

          # 2. Préparation du dossier d'entrée
          mkdir -p final_input
          cp target/demo2-1.0-SNAPSHOT.jar final_input/
          
          # 3. Copie des libs (GSON, SQLite, PDFBox ET JavaFX)
          mvn dependency:copy-dependencies -DoutputDirectory=final_input/
          
          # 4. Lancement de jpackage en utilisant le runtime réduit
          # L'utilisation de --runtime-image empêche jpackage d'aspirer tout le JDK
          jpackage \
            --type exe \
            --dest output/ \
            --name "E-Learning-P2P" \
            --input final_input/ \
            --main-jar demo2-1.0-SNAPSHOT.jar \
            --main-class org.example.Main \
            --runtime-image custom-runtime \
            --icon "src/main/resources/images/logo.ico" \
            --win-dir-chooser \
            --win-shortcut \
            --win-menu \
            --vendor "MonEntreprise" \
            --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Learning-P2P-Installer
          path: output/*.exe