name: Build Windows Installer
on: 
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (Clean & Light JAR)
        shell: bash
        run: |
          # On nettoie tout et on génère un JAR sans dépendances internes
          mvn clean package -DskipTests -Dshade.skip=true

      - name: Setup JavaFX Modules
        shell: bash
        run: |
          curl -L -o javafx-jmods.zip https://download2.gluonhq.com/openjfx/17.0.10/openjfx-17.0.10_windows-x64_bin-jmods.zip
          unzip -q javafx-jmods.zip

      - name: Create Executable Package (Windows)
        shell: bash
        run: |
          # 1. On repart sur un dossier ultra-propre
          mkdir -p final_input
          
          # 2. On copie TOUT dedans (le JAR et TOUTES les libs)
          cp target/demo2-1.0-SNAPSHOT.jar final_input/
          mvn dependency:copy-dependencies -DoutputDirectory=final_input/
          
          # 3. Suppression des JRE/JMODS téléchargés pour ne pas les inclure par erreur
          rm -rf javafx-jmods-17.0.10/
          rm -f javafx-jmods.zip

          # 4. Lancement de jpackage en mode "App-Image" simple
          # On laisse jpackage utiliser le JRE par défaut du runner
          jpackage \
            --type exe \
            --dest output/ \
            --name "E-Learning-P2P" \
            --input final_input/ \
            --main-jar demo2-1.0-SNAPSHOT.jar \
            --main-class org.example.Main \
            --icon "src/main/resources/images/logo.ico" \
            --win-dir-chooser \
            --win-shortcut \
            --win-menu \
            --vendor "MonEntreprise" \
            --verbose
            
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Learning-P2P-Installer
          path: output/*.exe