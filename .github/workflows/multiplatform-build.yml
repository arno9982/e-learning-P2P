name: Build Windows Only
on: 
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Setup JavaFX Modules
        shell: bash
        run: |
          curl -L -o javafx-jmods.zip https://download2.gluonhq.com/openjfx/17.0.8/openjfx-17.0.8_windows-x64_bin-jmods.zip
          unzip -q javafx-jmods.zip

      - name: Create Executable Package (Windows)
        shell: bash
        run: |
          # 1. Isolation du JAR (évite les 3 Go de fichiers inutiles)
          mkdir input_dir
          cp target/demo2-1.0-SNAPSHOT.jar input_dir/
          
          # 2. Création de l'image application épurée
          jpackage --name "E-Learning-P2P" \
                   --input input_dir/ \
                   --main-jar demo2-1.0-SNAPSHOT.jar \
                   --main-class org.example.Main \
                   --dest output/ \
                   --icon src/main/resources/images/logo.ico \
                   --module-path javafx-jmods-17.0.8/ \
                   --add-modules javafx.controls,javafx.fxml,javafx.graphics,javafx.web,javafx.media,java.net.http,java.sql \
                   --no-header-files \
                   --no-man-pages \
                   --type app-image

          # 3. Compression en ZIP (Seule méthode fiable pour conserver la structure)
          cd output
          7z a -tzip "../E-Learning-P2P-Windows.zip" "E-Learning-P2P/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Learning-P2P-Windows
          path: E-Learning-P2P-Windows.zip