name: Build Multi-Platform
on: 
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: osx

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Setup JavaFX Modules
        shell: bash
        run: |
          # Téléchargement robuste avec retries pour éviter l'erreur curl (18)
          curl -L --retry 5 --connect-timeout 30 -o javafx-jmods.zip https://download2.gluonhq.com/openjfx/17.0.8/openjfx-17.0.8_${{ matrix.platform }}-x64_bin-jmods.zip
          unzip -q javafx-jmods.zip

      - name: Create Executable Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Nettoyage préventif du dossier target pour libérer de la mémoire
          find target/ -type f -not -name "demo2-1.0-SNAPSHOT.jar" -delete
          
          # Création de l'image application (plus léger que l'installeur EXE)
          jpackage --name "E-Learning-P2P" \
                   --input target/ \
                   --main-jar demo2-1.0-SNAPSHOT.jar \
                   --main-class org.example.Main \
                   --dest output/ \
                   --icon src/main/resources/images/logo.ico \
                   --module-path javafx-jmods-17.0.8/ \
                   --add-modules javafx.controls,javafx.fxml,javafx.graphics,javafx.web,javafx.media \
                   --type app-image

      - name: Create Executable Package (Non-Windows)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          jpackage --name "E-Learning-P2P" \
                   --input target/ \
                   --main-jar demo2-1.0-SNAPSHOT.jar \
                   --main-class org.example.Main \
                   --dest output/ \
                   --icon src/main/resources/images/logo.png \
                   --module-path javafx-jmods-17.0.8/ \
                   --add-modules javafx.controls,javafx.fxml,javafx.graphics,javafx.web,javafx.media \
                   --type ${{ matrix.os == 'macos-latest' && 'dmg' || 'deb' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Executable-${{ matrix.os }}
          path: output/