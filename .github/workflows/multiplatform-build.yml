name: Build Windows Installer
on: 
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        # ÉTAPE CLÉ : On saute le Shade pour éviter le JAR monstrueux
        shell: bash
        run: mvn clean package -DskipTests -Dshade.skip=true

      - name: Setup JavaFX Modules
        shell: bash
        run: |
          curl -L -o javafx-jmods.zip https://download2.gluonhq.com/openjfx/17.0.10/openjfx-17.0.10_windows-x64_bin-jmods.zip
          unzip -q javafx-jmods.zip

      - name: Create Executable Package (Windows)
        shell: bash
        run: |
          # 1. On isole le JAR léger
          mkdir -p input_dir
          cp target/demo2-1.0-SNAPSHOT.jar input_dir/
          
          # 2. On récupère les dépendances (GSON, SQLite...) proprement
          mvn dependency:copy-dependencies -DoutputDirectory=input_dir/libs

          # 3. Lancement de jpackage
          jpackage \
            --type exe \
            --dest output/ \
            --name "E-Learning-P2P" \
            --input input_dir/ \
            --main-jar demo2-1.0-SNAPSHOT.jar \
            --main-class org.example.Main \
            --icon "src/main/resources/images/logo.ico" \
            --module-path "javafx-jmods-17.0.10/;input_dir/libs" \
            --add-modules javafx.controls,javafx.fxml,javafx.graphics,javafx.web,javafx.media,javafx.swing,java.sql,java.net.http \
            --win-dir-chooser \
            --win-shortcut \
            --win-menu \
            --vendor "MonProjet" \
            --strip-debug \
            --no-header-files \
            --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Learning-P2P-Windows-Installer
          path: output/*.exe