name: Build Windows Installer
on: 
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        # On force l'utilisation de bash pour éviter les erreurs de parsing PowerShell
        shell: bash
        run: mvn clean package -DskipTests -Dshade.skip=true

      - name: Setup JavaFX Modules
        shell: bash
        run: |
          curl -L -o javafx-jmods.zip https://download2.gluonhq.com/openjfx/17.0.8/openjfx-17.0.8_windows-x64_bin-jmods.zip
          unzip -q javafx-jmods.zip

      - name: Create Executable Installer (.exe)
        shell: bash
        run: |
          # 1. Isolation stricte : on ne prend QUE le JAR nécessaire
          mkdir bundle_input
          cp target/demo2-1.0-SNAPSHOT.jar bundle_input/
          
          # 2. On copie les dépendances (GSON, SQLite, etc.) car le shade est désactivé
          mvn dependency:copy-dependencies -DoutputDirectory=bundle_input/libs

          # 3. Création de l'installeur
          # On ajoute javafx.swing qui est présent dans votre pom.xml
          jpackage \
            --type exe \
            --dest output/ \
            --name "E-Learning-P2P" \
            --input bundle_input/ \
            --main-jar demo2-1.0-SNAPSHOT.jar \
            --main-class org.example.Main \
            --icon "src/main/resources/images/logo.ico" \
            --module-path "javafx-jmods-17.0.8/;bundle_input/libs" \
            --add-modules javafx.controls,javafx.fxml,javafx.graphics,javafx.web,javafx.media,javafx.swing,java.net.http,java.sql \
            --win-dir-chooser \
            --win-shortcut \
            --win-menu \
            --vendor "MonEntreprise" \
            --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Learning-P2P-Installer
          path: output/*.exe