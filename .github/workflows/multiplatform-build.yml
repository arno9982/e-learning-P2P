name: Build Windows Installer
on: 
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (Clean & Light JAR)
        shell: bash
        run: |
          # Nettoyage total et build du JAR principal uniquement
          mvn clean package -DskipTests -Dshade.skip=true

      - name: Create Custom Slim Runtime (jlink)
        shell: bash
        run: |
          # On crée un environnement Java minimaliste pour réduire la taille de 3Go à ~50Mo
          # On inclut les modules de base + ceux nécessaires pour SQL, le réseau et l'interface
          $JAVA_HOME/bin/jlink \
            --add-modules java.base,java.sql,java.naming,java.desktop,java.management,java.security.jgss,java.instrument,java.net.http,jdk.unsupported,java.scripting,java.xml,jdk.crypto.ec \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=2 \
            --output custom-runtime

      - name: Create Executable Package (Windows)
        shell: bash
        run: |
          # 1. Préparation du dossier d'entrée isolé
          mkdir -p final_input
          cp target/demo2-1.0-SNAPSHOT.jar final_input/
          
          # 2. Copie des dépendances (GSON, SQLite, PDFBox, JavaFX JARs)
          mvn dependency:copy-dependencies -DoutputDirectory=final_input/
          
          # 3. Diagnostic de taille (pour vérifier qu'on est bien loin des 2 Go)
          echo "Taille du dossier final_input :"
          du -sh final_input/

          # 4. Lancement de jpackage avec le runtime réduit
          # L'option --runtime-image est CRUCIALE ici
          jpackage \
            --type exe \
            --dest output/ \
            --name "E-Learning-P2P" \
            --input final_input/ \
            --main-jar demo2-1.0-SNAPSHOT.jar \
            --main-class org.example.Main \
            --runtime-image custom-runtime \
            --icon "src/main/resources/images/logo.ico" \
            --win-dir-chooser \
            --win-shortcut \
            --win-menu \
            --vendor "MonEntreprise" \
            --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Learning-P2P-Installer
          path: output/*.exe