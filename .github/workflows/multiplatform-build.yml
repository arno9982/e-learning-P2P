name: Build Multi-Platform
on: 
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: osx

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (Create Fat JAR)
        run: mvn clean package -DskipTests

      - name: Setup JavaFX Modules
        shell: bash
        run: |
          # Utilisation de curl pour la compatibilité Windows/Linux
          curl -L -o javafx-jmods.zip https://download2.gluonhq.com/openjfx/17.0.8/openjfx-17.0.8_${{ matrix.platform }}-x64_bin-jmods.zip
          unzip javafx-jmods.zip

      - name: Create Executable Package
        shell: bash
        run: |
          jpackage --name "E-Learning-P2P" \
                   --input target/ \
                   --main-jar demo2-1.0-SNAPSHOT.jar \
                   --main-class org.example.Main \
                   --dest output/ \
                   --vendor "MonProjet" \
                   --module-path javafx-jmods-17.0.8/ \
                   --add-modules javafx.controls,javafx.fxml,javafx.graphics,javafx.web,javafx.media \
                   --type ${{ matrix.os == 'windows-latest' && 'exe' || (matrix.os == 'macos-latest' && 'dmg' || 'deb') }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Executable-${{ matrix.os }}
          path: output/