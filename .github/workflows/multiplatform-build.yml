name: Build Windows Installer
on: 
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (Clean & Light JAR)
        shell: bash
        run: |
          # On nettoie tout et on génère un JAR sans dépendances internes
          mvn clean package -DskipTests -Dshade.skip=true

      - name: Setup JavaFX Modules
        shell: bash
        run: |
          curl -L -o javafx-jmods.zip https://download2.gluonhq.com/openjfx/17.0.10/openjfx-17.0.10_windows-x64_bin-jmods.zip
          unzip -q javafx-jmods.zip

      - name: Create Executable Package (Windows)
        shell: bash
        run: |
          # 1. Préparation d'un dossier source TOTALEMENT isolé
          mkdir -p isolated_input/libs
          
          # 2. Copie du JAR principal
          cp target/demo2-1.0-SNAPSHOT.jar isolated_input/
          
          # 3. Récupération des dépendances externes
          mvn dependency:copy-dependencies -DoutputDirectory=isolated_input/libs
          
          # 4. NETTOYAGE : Suppression des doublons JavaFX (conflits de taille)
          rm -f isolated_input/libs/javafx-*.jar

          # 5. DIAGNOSTIC : Afficher la taille du dossier d'entrée dans les logs
          echo "--- TAILLE DU DOSSIER D'ENTRÉE ---"
          du -sh isolated_input/
          echo "--- CONTENU DU DOSSIER ---"
          ls -R isolated_input/

          # 6. Lancement de jpackage
          # Note: On utilise --temp pour éviter de saturer le disque du runner
          jpackage \
            --type exe \
            --dest output/ \
            --name "E-Learning-P2P" \
            --input isolated_input/ \
            --main-jar demo2-1.0-SNAPSHOT.jar \
            --main-class org.example.Main \
            --icon "src/main/resources/images/logo.ico" \
            --module-path "javafx-jmods-17.0.10/;isolated_input/libs" \
            --add-modules javafx.controls,javafx.fxml,javafx.graphics,javafx.web,javafx.media,javafx.swing,java.sql,java.net.http \
            --win-dir-chooser \
            --win-shortcut \
            --win-menu \
            --vendor "MonEntreprise" \
            --temp jpackage_temp \
            --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Learning-P2P-Installer
          path: output/*.exe