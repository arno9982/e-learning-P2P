name: Build Windows Installer
on: 
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Setup JavaFX Modules
        shell: bash
        run: |
          curl -L -o javafx-jmods.zip https://download2.gluonhq.com/openjfx/17.0.8/openjfx-17.0.8_windows-x64_bin-jmods.zip
          unzip -q javafx-jmods.zip

      - name: Create Custom Slim Runtime (jlink)
        shell: bash
        run: |
          # Création d'un JRE sur mesure contenant uniquement le strict nécessaire
          # Cela réduit la mémoire consommée par light.exe lors de la compression
          $JAVA_HOME/bin/jlink \
            --module-path "javafx-jmods-17.0.8;$JAVA_HOME/jmods" \
            --add-modules javafx.controls,javafx.fxml,javafx.graphics,javafx.web,javafx.media,java.net.http,java.sql,java.naming \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=2 \
            --output custom-runtime

      - name: Create Windows Installer (.exe)
        shell: bash
        run: |
          # 1. Isolation du JAR
          mkdir input_dir
          cp target/demo2-1.0-SNAPSHOT.jar input_dir/
          
          # 2. Création de l'installeur utilisant le runtime réduit
          jpackage --name "E-Learning-P2P" \
                   --input input_dir/ \
                   --main-jar demo2-1.0-SNAPSHOT.jar \
                   --main-class org.example.Main \
                   --dest output/ \
                   --runtime-image custom-runtime \
                   --icon src/main/resources/images/logo.ico \
                   --win-dir-chooser \
                   --win-shortcut \
                   --win-menu \
                   --type exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Learning-P2P-Installer
          path: output/*.exe